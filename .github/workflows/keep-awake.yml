# Wakes the free Render service and keeps it awake. GitHub often runs scheduled jobs late,
# so also add a free uptime monitor (see UPTIME-CHECK.md). The server also pings itself while awake.
name: Keep site awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health check (retries while the service wakes up)
        run: |
          for i in 1 2 3 4; do
            if curl -fsS --max-time 60 https://gupta-cyber-cafe.onrender.com/healthz; then echo " ok"; exit 0; fi
            echo "attempt $i failed, retrying"; sleep 15
          done
          exit 1
