# Pings the site every 10 minutes so the free Render service does not go to sleep.
name: Keep site awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        run: curl -fsS --max-time 90 https://gupta-cyber-cafe.onrender.com/healthz
